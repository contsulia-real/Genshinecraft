name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      task:
        description: "Gradle task (for example :neoforge:26.3:build or chiseledBuild)"
        required: true
        default: ":fabric:1.21.1:build"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build selected target
        env:
          GRADLE_TASK: ${{ inputs.task || ':fabric:1.21.1:build' }}
        run: ./gradlew "$GRADLE_TASK" --no-daemon --no-parallel
      - uses: actions/upload-artifact@v4
        with:
          name: genshinecraft-jars
          path: |
            fabric/versions/*/build/libs/*.jar
            forge/versions/*/build/libs/*.jar
            neoforge/versions/*/build/libs/*.jar
          if-no-files-found: error
